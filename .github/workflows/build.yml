name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LastZone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LastZone
          path: LastZone.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: LastZone 1.${{ github.run_number }}
          body: |
            3D battle royale. Install on your phone: download **LastZone.apk** below and open it.
            Always-latest link: https://github.com/${{ github.repository }}/releases/latest/download/LastZone.apk
          files: LastZone.apk
          make_latest: true
