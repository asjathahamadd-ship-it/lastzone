<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Last Zone 3D</title>
<style>
/* VOICE: arcade military shooter, loud but readable
   IDEA: first-person view through a soldier's visor over a sunny island
   PICTURE: the live 3D world fills the screen
   COLOUR and TYPE: sky blue, meadow green, storm violet, signal amber HUD; Impact-style display + system sans
   LAYOUT: full-bleed canvas, HUD in corners, thumb controls on phones */
:root{--amber:#ffb020;--ink:#f4f1e8;--glass:rgba(8,12,16,.6)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);font:700 15px/1.25 "Segoe UI",Roboto,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.hud{position:fixed;pointer-events:none;z-index:3}
.disp{font-family:Impact,"Arial Black","Segoe UI Black",sans-serif;font-weight:400;letter-spacing:1px}
#top{top:10px;left:10px;display:flex;gap:6px}
.pill{background:var(--glass);padding:5px 11px;border-radius:8px;font-size:16px}
.pill b{color:var(--amber)}
#zoneMsg{top:10px;left:50%;transform:translateX(-50%);white-space:nowrap}
#zoneMsg.alert{background:rgba(120,40,200,.8)}
#mini{top:10px;right:10px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
#feed{top:138px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px}
#feed div{background:var(--glass);padding:2px 8px;border-radius:6px}
#feed .me{color:var(--amber)}
#bottom{bottom:10px;left:50%;transform:translateX(-50%);width:min(360px,46vw);text-align:center}
#slots{display:flex;gap:6px;justify-content:center;margin-bottom:5px}
.slot{background:var(--glass);border:2px solid transparent;border-radius:8px;padding:3px 10px;font-size:14px;min-width:92px}
.slot.on{border-color:var(--amber)}
.slot small{display:block;font-size:12px;color:#ddd;font-weight:600}
.bar{height:9px;background:rgba(0,0,0,.6);border-radius:5px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;transition:width .15s}
#hpBar i{background:linear-gradient(90deg,#33c46a,#a4f06a)}
#arBar i{background:linear-gradient(90deg,#3a8bff,#8cc8ff)}
#meds{margin-top:4px;font-size:13px;font-weight:600}
#prompt{bottom:96px;left:50%;transform:translateX(-50%);background:var(--glass);padding:6px 12px;border-radius:8px;display:none;white-space:nowrap}
#cross{left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross .h{width:10px;height:2px;top:-1px}#cross .v{width:2px;height:10px;left:-1px}
#hitm{left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;transition:opacity .08s}
#hitm::before,#hitm::after{content:"";position:absolute;left:12px;top:0;width:2px;height:26px;background:#fff;transform:rotate(45deg)}
#hitm::after{transform:rotate(-45deg)}
#hitm.head::before,#hitm.head::after{background:#ff4040}
#scope{inset:0;display:none;background:radial-gradient(circle at 50% 50%,transparent 0 30vmin,rgba(0,0,0,.92) 30.3vmin)}
#scope::before{content:"";position:absolute;left:50%;top:20vmin;bottom:20vmin;width:1px;background:#000}
#scope::after{content:"";position:absolute;top:50%;left:calc(50% - 30vmin);right:calc(50% - 30vmin);height:1px;background:#000}
#vig{inset:0;z-index:2;box-shadow:inset 0 0 140px rgba(255,0,0,0);transition:box-shadow .25s}
#storm{inset:0;z-index:2;background:rgba(120,40,210,.28);display:none}
#dmgDir{left:50%;top:50%;width:0;height:0;opacity:0;transition:opacity .4s}
#dmgDir i{position:absolute;left:-40px;top:-170px;width:80px;height:14px;border-radius:50%;background:rgba(255,30,30,.85);filter:blur(2px)}
#ctrls{position:fixed;inset:0;z-index:4;pointer-events:none;display:none}
.b{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(8,12,16,.45);border:2px solid rgba(255,255,255,.4);color:#fff;font:700 12px "Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.b.on{background:rgba(255,176,32,.55)}
#bFire{width:92px;height:92px;right:7%;bottom:22%;font-size:16px;background:rgba(220,50,40,.45)}
#bFire2{width:64px;height:64px;left:20px;top:42%;font-size:13px;background:rgba(220,50,40,.4)}
#bAds{width:62px;height:62px;right:calc(7% + 104px);bottom:calc(22% + 50px)}
#bReload{width:54px;height:54px;right:calc(7% + 18px);bottom:calc(22% + 104px)}
#bSwap{width:54px;height:54px;right:12px;top:150px}
#bPick{width:54px;height:54px;right:76px;top:150px}
#bHeal{width:54px;height:54px;right:calc(7% + 112px);bottom:calc(22% - 20px)}
#rotate{position:fixed;inset:0;z-index:9;background:#0b0f0c;display:none;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
#screen{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;background:linear-gradient(180deg,rgba(10,20,30,.35),rgba(6,8,6,.88))}
#screen h1{font-size:clamp(46px,11vw,92px);line-height:1;color:var(--amber);text-shadow:0 4px 0 #6b3d00,0 12px 30px rgba(0,0,0,.6)}
#screen h2{font-size:clamp(22px,5vw,34px);margin-top:8px}
#screen p{color:#d2d8c8;max-width:480px;margin-top:10px;font-weight:600;font-size:16px;line-height:1.4}
#screen .stats{display:flex;gap:30px;justify-content:center;margin-top:14px;color:#aab;font-size:14px}
#screen .stats b{display:block;font-size:36px;color:var(--ink)}
#keys{color:#a9b39c;margin-top:12px;font-size:14px;font-weight:600;line-height:1.6}
#play{margin-top:20px;font-size:26px;padding:12px 56px;border:0;border-radius:14px;background:var(--amber);color:#2a1800;cursor:pointer;box-shadow:0 6px 0 #9a5d00}
#play:active{transform:translateY(4px);box-shadow:0 2px 0 #9a5d00}
#play:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(max-width:700px),(max-height:450px){.slot{min-width:74px;font-size:12px}#mini{width:96px;height:96px}#feed{top:112px}.pill{font-size:13px}#bSwap,#bPick{top:120px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="vig"></div>
<div class="hud" id="storm"></div>
<div class="hud" id="scope"></div>
<div class="hud" id="cross"><i class="h" id="cl"></i><i class="h" id="cr"></i><i class="v" id="ct"></i><i class="v" id="cb"></i></div>
<div class="hud" id="hitm"></div>
<div class="hud" id="dmgDir"><i></i></div>
<div class="hud" id="top"><div class="pill">Alive <b id="alive">25</b></div><div class="pill">Kills <b id="kills">0</b></div></div>
<div class="hud pill" id="zoneMsg">Zone</div>
<canvas class="hud" id="mini"></canvas>
<div class="hud" id="feed"></div>
<div class="hud" id="prompt"></div>
<div class="hud" id="bottom"><div id="slots"></div><div class="bar" id="arBar"><i style="width:0"></i></div><div class="bar" id="hpBar"><i style="width:100%"></i></div><div id="meds"></div></div>
<div id="ctrls">
  <div class="b" id="bFire">FIRE</div><div class="b" id="bFire2">FIRE</div>
  <div class="b" id="bAds">AIM</div><div class="b" id="bReload">R</div>
  <div class="b" id="bSwap">SWAP</div><div class="b" id="bPick">PICK</div><div class="b" id="bHeal">HEAL</div>
</div>
<div id="rotate"><div><div class="disp" style="font-size:34px;color:#ffb020">ROTATE YOUR PHONE</div><p style="margin-top:10px;color:#ccc">Last Zone plays in landscape.</p></div></div>
<div id="screen">
  <h1 class="disp">LAST ZONE</h1>
  <p>25 soldiers drop onto one island. Loot weapons and armor, stay inside the closing storm, and be the last one standing.</p>
  <div id="keys"></div>
  <button id="play" class="disp">PLAY</button>
</div>
<script type="importmap">{"imports":{"three":"./three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';

{
const MAP = 300, HALF = 150, BOTS = 24, EYE = 1.65, PR = 0.45;
const $ = id => document.getElementById(id);

const WEAPONS = {

  smg:     {name:'SMG',     dmg:11, rate:.08, spread:.03,  range:55,  mag:30, reload:1.6, pellets:1, len:.45, col:0x4fd46e, css:'#5ee07a', rank:3, fov:60, botErr:.06},
  shotgun: {name:'Shotgun', dmg:11, rate:.85, spread:.07,  range:26,  mag:5,  reload:2.1, pellets:8, len:.6,  col:0x3d9bff, css:'#4aa8ff', rank:3, fov:62, botErr:.05},
  ar:      {name:'Rifle',   dmg:16, rate:.115,spread:.016, range:110, mag:30, reload:1.9, pellets:1, len:.7,  col:0xb06cff, css:'#c27bff', rank:5, fov:50, botErr:.04},
  sniper:  {name:'Sniper',  dmg:85, rate:1.3, spread:.002, range:260, mag:5,  reload:2.5, pellets:1, len:.95, col:0xffc531, css:'#ffc531', rank:4, fov:22, botErr:.02},
};
const NAMES = ['Ghost','Viper','Raza','Blaze','Nova','Hunter','Shadow','Kaiser','Falcon','Rocky','Storm','Jinx','Tiger','Ronin','Cobra','Maverick','Echo','Zara','Bullet','Phantom','Arjun','Sultan','Wolf','Spike','Ace','Titan','Rex','Hawk'];
const COLORS = [0xc0392b,0x2e78c7,0xd9822b,0x8e44ad,0x16a085,0xc2407f,0x7d9b2e,0xb89a22,0x4f63c9,0x9c5b3a,0x2f8f4e,0x546e7a];
const PHASES = [
  {wait:35, shrink:25, r:140, dps:1.5}, {wait:28, shrink:20, r:90, dps:3}, {wait:24, shrink:18, r:55, dps:5},
  {wait:20, shrink:15, r:30, dps:8}, {wait:15, shrink:12, r:12, dps:12}, {wait:10, shrink:10, r:0, dps:18},
];

// ---------------------------------------------------------------- three setup
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:!isTouch, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isTouch ? 1.25 : 1.75));
const scene = new THREE.Scene();
const SKY = 0xa8d4f0;
scene.background = new THREE.Color(SKY); scene.fog = new THREE.Fog(SKY, 70, 210);
const camera = new THREE.PerspectiveCamera(75, 1, .08, 500); camera.rotation.order = 'YXZ'; scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4d6e3a, .95));
const sun = new THREE.DirectionalLight(0xfff2d8, .9); sun.position.set(60, 120, 30); scene.add(sun);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  $('rotate').style.display = isTouch && h > w ? 'flex' : 'none'; }
addEventListener('resize', resize); resize();

// ground with generated texture
function makeGroundTex() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#5f9a45'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) { const l = rand(-18, 18); g.fillStyle = `rgb(${95 + l},${154 + l},${69 + l * .6})`; g.fillRect(rand(0, 256), rand(0, 256), rand(1, 4), rand(1, 4)); }

}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(MAP + 300, MAP + 300), new THREE.MeshLambertMaterial({map:makeGroundTex()}));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const edge = new THREE.Mesh(new THREE.RingGeometry(HALF * 1.414, HALF * 1.414 + 300, 64), new THREE.MeshBasicMaterial({color:0x3f7fb5}));
edge.rotation.x = -Math.PI / 2; edge.position.y = .02; scene.add(edge);

// shared geometry / materials
const G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  trunk: new THREE.CylinderGeometry(.28, .38, 3.2, 7),
  leaves: new THREE.IcosahedronGeometry(2.3, 0),
  rock: new THREE.DodecahedronGeometry(1, 0),
  head: new THREE.SphereGeometry(.26, 10, 8),
};
const matCache = {};
const lam = (c, e) => { const k = c + '_' + (e || 0); return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial({color:c, emissive:e || 0})); };

// ---------------------------------------------------------------- world state
let obstacles, items, fighters, zone, player, feed, state = 'menu', aliveCount = 0, hudT = 0, worldGroup = null;
let tracers = [], sparks = [];
let inst = {};

function overlaps(x, z, r) {
  if (Math.abs(x) > HALF - 4 || Math.abs(z) > HALF - 4) return true;
  for (const o of obstacles) {
    if (o.t === 'box') { if (Math.abs(x - o.x) < o.hx + r && Math.abs(z - o.z) < o.hz + r) return true; }
    else if (Math.hypot(x - o.x, z - o.z) < o.r + r) return true;
  }

}
function freeSpot(r, tries = 300) {
  for (let i = 0; i < tries; i++) { const x = rand(-HALF + 6, HALF - 6), z = rand(-HALF + 6, HALF - 6); if (!overlaps(x, z, r)) return {x, z}; }

}
function weighted(list) { let s = 0; for (const [, w] of list) s += w; let r = Math.random() * s; for (const [v, w] of list) if ((r -= w) <= 0) return v; return list[0][0]; }

function buildWorld() {
  if (worldGroup) scene.remove(worldGroup);
  worldGroup = new THREE.Group(); scene.add(worldGroup);
  obstacles = []; items = [];
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), e = new THREE.Euler();
  // houses
  const houseCols = [0xd9c7a3, 0xc9a27e, 0xb8b8b0, 0xe0d4b8, 0xa8b8a0, 0xc79a8a];
  for (let i = 0; i < 26; i++) {
    const hx = rand(4, 7), hz = rand(4, 7), h = rand(4.5, 7.5), sp = freeSpot(Math.max(hx, hz) + 3);
    obstacles.push({t:'box', x:sp.x, z:sp.z, hx, hz, h, kind:'house'});
    const body = new THREE.Mesh(G.box, lam(houseCols[i % houseCols.length])); body.scale.set(hx * 2, h, hz * 2); body.position.set(sp.x, h / 2, sp.z); worldGroup.add(body);
    const roof = new THREE.Mesh(G.box, lam(0x7a4636)); roof.scale.set(hx * 2 + .8, .6, hz * 2 + .8); roof.position.set(sp.x, h + .3, sp.z); worldGroup.add(roof);
    for (let k = 0; k < 4; k++) { const win = new THREE.Mesh(G.box, lam(0x2c3e50)); const side = k % 2 === 0; win.scale.set(side ? 1.4 : .1, 1.1, side ? .1 : 1.4); win.position.set(sp.x + (side ? rand(-hx + 1.5, hx - 1.5) : (k === 1 ? hx : -hx)), h * .55, sp.z + (side ? (k === 0 ? hz : -hz) : rand(-hz + 1.5, hz - 1.5))); worldGroup.add(win); }
  }
  // low walls (cover you can shoot over)
  for (let i = 0; i < 45; i++) {
    const along = Math.random() < .5, hx = along ? 3 : .3, hz = along ? .3 : 3, sp = freeSpot(3.5);
    obstacles.push({t:'box', x:sp.x, z:sp.z, hx, hz, h:1.3, kind:'wall'});
    const w = new THREE.Mesh(G.box, lam(0x9e9e94)); w.scale.set(hx * 2, 1.3, hz * 2); w.position.set(sp.x, .65, sp.z); worldGroup.add(w);
  }
  // crates (breakable) as instanced mesh
  const NC = 60; inst.crate = new THREE.InstancedMesh(G.box, lam(0xb07a3e), NC); worldGroup.add(inst.crate);
  for (let i = 0; i < NC; i++) {
    const sp = freeSpot(1.6), o = {t:'box', x:sp.x, z:sp.z, hx:.7, hz:.7, h:1.4, kind:'crate', hp:45, idx:i};

  const NT = 170; inst.trunk = new THREE.InstancedMesh(G.trunk, lam(0x6b4a2b), NT); inst.leaves = new THREE.InstancedMesh(G.leaves, lam(0x3d8a36), NT);

}
function randomLootKind() { return weighted([['pistol',8],['smg',10],['shotgun',9],['ar',8],['sniper',4],['bandage',18],['medkit',8],['armor',10]]); }
function addItem(kind, x, z) {
  const isGun = !!WEAPONS[kind];
  const col = isGun ? WEAPONS[kind].col : kind === 'armor' ? 0x3a8bff : kind === 'medkit' ? 0xff3344 : 0xff8f8f;

  const ring = new THREE.Mesh(new THREE.RingGeometry(.45, .6, 20), new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:.7}));
  ring.rotation.x = -Math.PI / 2; ring.position.set(x, .03, z); worldGroup.add(ring);

}
function removeItem(it) { worldGroup.remove(it.mesh); worldGroup.remove(it.ring); it.ring.geometry.dispose(); it.ring.material.dispose(); items.splice(items.indexOf(it), 1); }
function breakCrate(o) {

  inst.crate.setMatrixAt(o.idx, new THREE.Matrix4().makeScale(0, 0, 0)); inst.crate.instanceMatrix.needsUpdate = true;
  const n = Math.random() < .5 ? 2 : 1; for (let k = 0; k < n; k++) addItem(randomLootKind(), o.x + rand(-.6, .6), o.z + rand(-.6, .6));

}

// ---------------------------------------------------------------- fighters
let SOLDIER = null, MODEL_YAW = 0;
const shadowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 2, 32, 32, 30); gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const shadowMat = new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, depthWrite:false}), shadowGeo = new THREE.PlaneGeometry(1.3, 1.3);
function makeBotMesh(color) {
  const g = new THREE.Group();
  const model = SkeletonUtils.clone(SOLDIER.scene);
  model.rotation.y = MODEL_YAW;
  const tint = new THREE.Color(color).lerp(new THREE.Color(0xffffff), .5);
  model.traverse(o => { if (o.isMesh) { o.frustumCulled = false; o.material = o.material.clone(); o.material.color = tint; } });
  g.add(model);
  const mixer = new THREE.AnimationMixer(model);

new GLTFLoader().load('models/soldier.json', gltf => { SOLDIER = gltf; boot(); }, undefined, err => { console.error(err); $('play').textContent = 'LOAD FAILED'; });
function boot() {
$('play').textContent = 'PLAY'; $('play').disabled = false; $('play').onclick = start;
buildWorld(); fighters = []; feed = [];
player = makeFighter('You', false, 0); player.alive = false; fighters.push(player);
for (let i = 0; i < 10; i++) fighters.push(makeFighter(NAMES[i], true, COLORS[i % COLORS.length]));
aliveCount = fighters.length; zone = {x:0, z:0, r:215, phase:-1, dps:1, mode:'wait', t:0}; nextPhase();
let last = performance.now(), menuT = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try {
    if (state === 'play' || state === 'over') update(dt);
    else {
      menuT += dt * .05; zone.t = 99;
      for (const f of fighters) if (f.isBot && f.alive) { botUpdate(f, dt); f.mesh.position.set(f.x, 0, f.z); f.mesh.rotation.y = f.yaw; setAnim(f, f.moving ? 'run' : 'idle'); f.mesh.userData.mixer.update(dt); }
      camera.position.set(Math.cos(menuT) * 90, 38, Math.sin(menuT) * 90); camera.lookAt(0, 0, 0);
      vm.visible = false;
    }
    renderer.render(scene, camera);
  } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
}
